<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devan's Inventory</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ffffff;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            padding-bottom: 100px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 { margin: 0; font-size: 24px; font-weight: 600; }
        .controls { display: flex; gap: 10px; }
        select, button, input, textarea {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        button { cursor: pointer; background-color: var(--card-bg); }
        button:hover { border-color: var(--accent); }
        #login-btn { background: none; border: none; font-size: 20px; padding: 0; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .carousel {
            position: relative;
            width: 100%;
            height: 250px;
            background-color: #000;
        }
        .carousel-images {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            height: 100%;
        }
        .carousel-images::-webkit-scrollbar { display: none; }
        .carousel-images img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            flex: 0 0 100%;
            scroll-snap-align: center;
        }
        .carousel-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .card-content { padding: 15px; cursor: pointer; }
        .card h3 { margin: 0 0 5px 0; font-size: 18px; }
        .tag {
            display: inline-block;
            font-size: 12px;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 12px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .card-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }
        .action-btn { background: none; border: none; color: var(--text-muted); }
        .action-btn:hover { color: var(--accent); }
        
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--accent);
            color: var(--bg-color);
            font-size: 30px;
            display: none; /* Hidden until logged in */
            align-items: center;
            justify-content: center;
            border: none;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
            z-index: 100;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content input, .modal-content textarea { width: 100%; box-sizing: border-box; }
        .btn-primary { background-color: var(--accent); color: var(--bg-color); font-weight: bold; border: none;}
        .admin-only { display: none !important; }
        .is-admin .admin-only { display: flex !important; }
        .is-admin .admin-inline { display: inline-block !important; }
    </style>
</head>
<body id="app-body">

    <header>
        <h1>Devan's Inventory</h1>
        <div class="controls">
            <select id="sort-filter">
                <option value="all">All Items</option>
            </select>
            <button id="login-btn" title="Admin Login">🔒</button>
        </div>
    </header>

    <div class="grid" id="inventory-grid"></div>

    <button class="fab admin-only" id="add-btn">+</button>

    <!-- Admin Login Modal -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <h2 style="margin-top:0">Admin Login</h2>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button class="btn-primary" id="submit-login">Log In</button>
            <button onclick="document.getElementById('login-modal').style.display='none'">Cancel</button>
        </div>
    </div>

    <!-- Add/Edit Item Modal -->
    <div class="modal" id="item-modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-top:0">Add Item</h2>
            <input type="hidden" id="item-id">
            <input type="text" id="item-name" placeholder="Item Name (e.g. Vintage Hoodie)" required>
            <input type="text" id="item-category" placeholder="Category (e.g. Outerwear, Sneakers)" required>
            <textarea id="item-notes" placeholder="Notes (Size, condition, etc.)" rows="3"></textarea>
            
            <label>Upload Photos:</label>
            <input type="file" id="item-photos" accept="image/*" multiple>
            
            <button class="btn-primary" id="save-item-btn">Save Item</button>
            <button onclick="document.getElementById('item-modal').style.display='none'">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // IMPORTANT: PASTE YOUR FIREBASE CONFIG HERE
        const firebaseConfig = {
           apiKey: "AIzaSyATl5_lObDL8HVX8-auc-E48XCb4sm4AwI",
  authDomain: "devanscloset-54b7e.firebaseapp.com",
  projectId: "devanscloset-54b7e",
  storageBucket: "devanscloset-54b7e.firebasestorage.app",
  messagingSenderId: "345849388549",
  appId: "1:345849388549:web:ecc68cb6dfab98587a066c",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let isAdmin = false;
        let inventory = [];

        // Auth Logic
        const body = document.getElementById('app-body');
        const loginBtn = document.getElementById('login-btn');
        const loginModal = document.getElementById('login-modal');

        onAuthStateChanged(auth, (user) => {
            isAdmin = !!user;
            loginBtn.textContent = isAdmin ? '🔓' : '🔒';
            if(isAdmin) body.classList.add('is-admin');
            else body.classList.remove('is-admin');
            renderItems();
        });

        loginBtn.addEventListener('click', () => isAdmin ? signOut(auth) : loginModal.style.display = 'flex');

        document.getElementById('submit-login').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value)
                .then(() => { loginModal.style.display = 'none'; })
                .catch(err => alert(err.message));
        });

        // Inventory Logic
        onSnapshot(collection(db, "items"), (snapshot) => {
            inventory = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            updateFilters();
            renderItems();
        });

        function updateFilters() {
            const filter = document.getElementById('sort-filter');
            const currentVal = filter.value;
            const categories = [...new Set(inventory.map(i => i.category.toLowerCase()))];
            
            filter.innerHTML = '<option value="all">All Items</option>';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
                filter.appendChild(opt);
            });
            filter.value = currentVal;
        }

        document.getElementById('sort-filter').addEventListener('change', renderItems);

        function renderItems() {
            const grid = document.getElementById('inventory-grid');
            const filterVal = document.getElementById('sort-filter').value;
            grid.innerHTML = '';

            const filtered = filterVal === 'all' ? inventory : inventory.filter(i => i.category.toLowerCase() === filterVal);

            filtered.forEach(item => {
                const imagesHTML = item.images ? item.images.map(src => `<img src="${src}">`).join('') : '';
                const indHTML = item.images && item.images.length > 1 ? `<div class="carousel-indicator">1 / ${item.images.length}</div>` : '';
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="carousel">
                        <div class="carousel-images" onscroll="updateIndicator(this)">
                            ${imagesHTML}
                        </div>
                        ${indHTML}
                    </div>
                    <div class="card-content">
                        <span class="tag">${item.category}</span>
                        <h3>${item.name}</h3>
                        ${item.notes ? `<p style="font-size:12px; color:var(--text-muted);">${item.notes}</p>` : ''}
                        
                        <div class="card-actions">
                            <a href="[https://www.google.com/search?q=$](https://www.google.com/search?q=$){encodeURIComponent(item.name + ' restock buy')}" target="_blank" class="action-btn" style="text-decoration: none;">🔍 Restock</a>
                            <button class="action-btn admin-only" onclick="deleteItem('${item.id}')">Delete</button>
                            <button class="action-btn admin-only" onclick="editItem('${item.id}')">Edit</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.updateIndicator = function(el) {
            const index = Math.round(el.scrollLeft / el.clientWidth) + 1;
            const ind = el.nextElementSibling;
            if (ind && ind.classList.contains('carousel-indicator')) {
                const total = el.children.length;
                ind.textContent = `${index} / ${total}`;
            }
        };

        // Add/Edit Logic & Image Compression
        document.getElementById('add-btn').addEventListener('click', () => {
            document.getElementById('item-id').value = '';
            document.getElementById('item-name').value = '';
            document.getElementById('item-category').value = '';
            document.getElementById('item-notes').value = '';
            document.getElementById('item-photos').value = '';
            document.getElementById('modal-title').textContent = 'Add Item';
            document.getElementById('item-modal').style.display = 'flex';
        });

        window.editItem = function(id) {
            const item = inventory.find(i => i.id === id);
            document.getElementById('item-id').value = item.id;
            document.getElementById('item-name').value = item.name;
            document.getElementById('item-category').value = item.category;
            document.getElementById('item-notes').value = item.notes || '';
            document.getElementById('modal-title').textContent = 'Edit Item';
            document.getElementById('item-modal').style.display = 'flex';
        };

        window.deleteItem = async function(id) {
            if(confirm("Delete this item?")) {
                await deleteDoc(doc(db, "items", id));
            }
        };

        document.getElementById('save-item-btn').addEventListener('click', async () => {
            const id = document.getElementById('item-id').value;
            const name = document.getElementById('item-name').value;
            const category = document.getElementById('item-category').value;
            const notes = document.getElementById('item-notes').value;
            const files = document.getElementById('item-photos').files;
            
            let images = [];
            
            // Basic canvas compression to save Firebase space
            for (let file of files) {
                const dataUrl = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 800;
                            const scaleSize = MAX_WIDTH / img.width;
                            canvas.width = MAX_WIDTH;
                            canvas.height = img.height * scaleSize;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL('image/jpeg', 0.7));
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
                images.push(dataUrl);
            }

            const itemData = { name, category, notes };
            if (images.length > 0) itemData.images = images; // Only overwrite images if new ones uploaded

            if (id) {
                await updateDoc(doc(db, "items", id), itemData);
            } else {
                await addDoc(collection(db, "items"), itemData);
            }
            
            document.getElementById('item-modal').style.display = 'none';
        });
    </script>
</body>
</html>
